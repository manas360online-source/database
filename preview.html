<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manas360 | Database Explorer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #64748b;
            --bg: #0f172a;
            --sidebar-bg: #1e293b;
            --glass: rgba(255, 255, 255, 0.05);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
            --accent: #22d3ee;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 24px;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 40px;
            background: linear-gradient(135deg, var(--accent), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav {
            overflow-y: auto;
            flex: 1;
            padding-right: 8px;
        }

        .nav::-webkit-scrollbar { width: 4px; }
        .nav::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        .nav-item {
            padding: 12px 16px;
            border-radius: 10px;
            color: var(--text-dim);
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 4px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-item:hover {
            background: var(--glass);
            color: var(--text-main);
        }

        .nav-item.active {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4);
        }

        /* Main Content */
        .main {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            position: relative;
        }

        .header {
            margin-bottom: 32px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 600;
            color: white;
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 14px;
            margin-top: 8px;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: var(--glass);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        .stat-card h3 { font-size: 12px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 8px; }
        .stat-card p { font-size: 24px; font-weight: 700; color: white; }

        /* Table Section */
        .table-container {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th {
            background: rgba(0, 0, 0, 0.2);
            padding: 16px 24px;
            text-align: left;
            color: var(--text-dim);
            font-weight: 500;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            color: var(--text-main);
        }

        tr:last-child td { border-bottom: none; }
        tr:hover { background: rgba(255, 255, 255, 0.02); }

        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .badge-success { background: rgba(34, 197, 94, 0.1); color: #4ade80; }
        .badge-primary { background: rgba(99, 102, 241, 0.1); color: #818cf8; }
        .badge-warning { background: rgba(234, 179, 8, 0.1); color: #fbbf24; }

        .search-bar {
            background: var(--sidebar-bg);
            border: 1px solid var(--border);
            padding: 10px 20px;
            border-radius: 10px;
            color: white;
            width: 300px;
        }

        .search-bar::placeholder { color: var(--text-dim); }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L2 7L12 12L22 7L12 2Z" fill="currentColor" />
                <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            Manas360
        </div>
        <div class="nav" id="sidebar-nav">
            <!-- Nav items inserted here -->
        </div>
    </div>

    <div class="main">
        <div class="header">
            <div>
                <h1 id="table-title">Select a Table</h1>
                <p class="subtitle" id="table-description">Manage and explore your database records.</p>
            </div>
            <input type="text" class="search-bar" placeholder="Search records...">
        </div>

        <div class="stats-row" id="stats-row">
            <!-- Stats cards -->
        </div>

        <div class="table-container">
            <table id="data-table">
                <thead id="table-head"></thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        const tableData = {
            users: {
                title: "Users",
                description: "Core authentication and role management.",
                columns: ["ID", "Email", "Role", "Subscription", "Status", "Created At"],
                rows: [
                    ["u111...1111", "admin@manas360.com", "admin", "Infinite", "Active", "2026-01-20"],
                    ["u444...4444", "doctor1@hospital.com", "referring_doctor", "Gold", "Active", "2026-02-12"],
                    ["u222...2222", "therapist1@manas360.com", "therapist", "Tier 2", "Active", "2026-02-10"],
                    ["u333...3333", "patient1@manas360.com", "patient", "Tier 1", "Active", "2026-02-11"]
                ]
            },
            doctor_profiles: {
                title: "Doctor Profiles",
                description: "Profiles for referring medical professionals.",
                columns: ["Doctor Code", "Name", "Specialization", "Tier", "City", "Status"],
                rows: [
                    ["DR-KA-0001", "Dr. Ramesh Kumar", "Cardiologist", "Bronze", "Bangalore", "Verified"]
                ]
            },
            therapist_profiles: {
                title: "Therapist Profiles",
                description: "Platform therapy service providers.",
                columns: ["Name", "Specialization", "Exp (Years)", "Rate", "Rating"],
                rows: [
                    ["Aruna Sharma", "CBT Specialist", "8", "₹1500", "4.8/5"]
                ]
            },
            patients: {
                title: "Patients",
                description: "Registered patients and health seekers.",
                columns: ["Name", "Email", "Referred By", "Risk Level", "Created At"],
                rows: [
                    ["John Doe", "patient1@manas360.com", "DR-KA-0001", "Low", "2026-02-11"]
                ]
            },
            doctor_referrals: {
                title: "Doctor Referrals",
                description: "Tracking referrals from external doctors.",
                columns: ["Session ID", "Doctor Code", "Timestamp", "Status", "LTV"],
                rows: [
                    ["sess_abc123", "DR-KA-0001", "2026-02-12 10:45", "Subscribed", "₹5000"]
                ]
            },
            sessions: {
                title: "Sessions",
                description: "Therapy and assessment sessions.",
                columns: ["Patient", "Therapist", "Type", "Mode", "Status", "Fee"],
                rows: [
                    ["John Doe", "Aruna Sharma", "Therapy", "Online", "Completed", "₹1500"]
                ]
            },
            doctor_credits: {
                title: "Doctor Credits",
                description: "Reward points for referring doctors.",
                columns: ["Doctor", "Credits", "Type", "Multiplier", "Description"],
                rows: [
                    ["DR-KA-0001", "100", "Signup", "1.0", "Incentive for first referral signup"]
                ]
            },
            assessments: {
                title: "Assessments",
                description: "Patient clinical assessments (PHQ-9, GAD-7).",
                columns: ["Patient", "Type", "PHQ-9", "GAD-7", "Severity"],
                rows: [
                    ["John Doe", "PHQ-9", "12", "8", "Moderate"]
                ]
            },
            leads: {
                title: "Leads",
                description: "Patient-therapist matching leads.",
                columns: ["Patient", "Therapist", "Match %", "Status", "Created"],
                rows: [
                    ["John Doe", "Aruna Sharma", "85.5%", "Converted", "2026-02-12"]
                ]
            },
            transactions: {
                title: "Transactions",
                description: "Financial records and payments.",
                columns: ["Amount", "User", "Type", "Payment ID", "Status"],
                rows: [
                    ["₹1500.00", "u333...3333", "Session", "PAY-99212", "Captured"]
                ]
            },
            certificates: {
                title: "Certificates",
                description: "Issued program completion certificates.",
                columns: ["Patient", "Program", "Issued By", "Date"],
                rows: [
                    ["John Doe", "Anxiety Relief", "Aruna Sharma", "2026-02-12"]
                ]
            },
            audit_logs: {
                title: "Audit Logs",
                description: "System activity and security logs.",
                columns: ["User", "Entity", "Action", "IP Address", "Timestamp"],
                rows: [
                    ["admin@manas360.com", "user", "Login", "192.168.1.1", "2026-02-12 13:55"]
                ]
            },
            cbt_session_data: {
                title: "CBT Data",
                description: "Progressive CBT session inputs.",
                columns: ["Session ID", "Activity", "Step", "Input Snippet"],
                rows: [
                    ["sess_abc123", "Thought Record", "1", "I felt anxious before..."]
                ]
            },
            doctor_redemptions: {
                title: "Redemptions",
                description: "Doctor reward redemption requests.",
                columns: ["Doctor", "Credits", "Reward", "Status"],
                rows: [
                    ["DR-KA-0001", "50", "Amazon Voucher", "Completed"]
                ]
            },
            doctor_asset_orders: {
                title: "Asset Orders",
                description: "Physical marketing material orders.",
                columns: ["Order #", "Items", "Total", "Status"],
                rows: [
                    ["ORD-001", "Desk Card (1)", "₹299.00", "Delivered"]
                ]
            },
            dim_campaigns: {
                title: "Campaigns",
                description: "Marketing campaign dimensions.",
                columns: ["Name", "Type", "Start Date", "End Date", "Active"],
                rows: [
                    ["Feb Heart Health", "Email", "2026-02-01", "2026-02-28", "Yes"]
                ]
            },
            fact_qr_tracking: {
                title: "QR Tracking",
                description: "Daily QR scan analytics.",
                columns: ["Campaign", "Doctor Code", "Scan Date", "City", "Device"],
                rows: [
                    ["Feb Heart Health", "DR-KA-0001", "2026-02-12", "Bangalore", "Mobile"]
                ]
            }
        };

        function renderTable(key) {
            const data = tableData[key];
            document.getElementById('table-title').textContent = data.title;
            document.getElementById('table-description').textContent = data.description;

            // Render Head
            const head = document.getElementById('table-head');
            head.innerHTML = `<tr>${data.columns.map(c => `<th>${c}</th>`).join('')}</tr>`;

            // Render Body
            const body = document.getElementById('table-body');
            body.innerHTML = data.rows.map(row => `
                <tr>
                    ${row.map(cell => {
                        let content = cell;
                        if (cell === 'Active' || cell === 'Verified' || cell === 'Completed' || cell === 'Captured' || cell === 'Subscribed' || cell === 'Yes' || cell === 'Delivered' || cell === 'Converted') {
                            content = `<span class="badge badge-success">${cell}</span>`;
                        } else if (cell === 'admin' || cell === 'referring_doctor' || cell === 'Therapy') {
                            content = `<span class="badge badge-primary">${cell}</span>`;
                        } else if (cell === 'Low' || cell === 'Moderate' || cell === 'Pending') {
                            content = `<span class="badge badge-warning">${cell}</span>`;
                        }
                        return `<td>${content}</td>`;
                    }).join('')}
                </tr>
            `).join('');

            // Update Active Nav
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.querySelector(`[data-key="${key}"]`).classList.add('active');

            // Render Stats Cards
            const statsRow = document.getElementById('stats-row');
            statsRow.innerHTML = `
                <div class="stat-card"><h3>Total Records</h3><p>${data.rows.length}</p></div>
                <div class="stat-card"><h3>Last Updated</h3><p>Today</p></div>
                <div class="stat-card"><h3>Schema Version</h3><p>Sprint 9 (v2.0)</p></div>
                <div class="stat-card"><h3>Relationships</h3><p>${key === 'users' ? '1:N' : 'Linked'}</p></div>
            `;
        }

        // Init sidebar
        const nav = document.getElementById('sidebar-nav');
        Object.keys(tableData).forEach(key => {
            const item = document.createElement('div');
            item.className = 'nav-item';
            item.setAttribute('data-key', key);
            item.innerHTML = `
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="3" y1="9" x2="21" y2="9"></line>
                    <line x1="9" y1="21" x2="9" y2="9"></line>
                </svg>
                ${tableData[key].title}
            `;
            item.onclick = () => renderTable(key);
            nav.appendChild(item);
        });

        // Default render
        renderTable('users');
    </script>
</body>
</html>
